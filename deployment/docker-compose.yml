version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ai_medical_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_medical_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: ai_medical_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=ai_medical_db
      - SECRET_KEY=medical-intelligence-super-secret-key-change-in-production
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: ai_medical_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
